[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["apps/desktop", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1.6", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
nostr-sdk = "0.45.4"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
wasmtime = { version = "=48.0.3", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
wasmparser = "0.258"
frost-ed25519 = "3"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
url = "2"
