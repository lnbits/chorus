[package]
name = "chorus-desktop"
version = "0.1.0"
edition = "2024"
[build-dependencies]
tauri-build = "2"
[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
chorus-storage = { path = "../../crates/storage" }
chorus-nostr = { path = "../../crates/nostr" }
nostr-sdk = "0.45.4"
zeroize = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }
[workspace]
